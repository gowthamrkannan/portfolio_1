<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0F172A" />
  <rect width="98" height="98" x="1" y="1" rx="23" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.4" />
  
  <!-- Java Steam -->
  <path d="M42 22 C46 16, 38 12, 44 8 C48 12, 44 16, 48 20" fill="none" stroke="#FB923C" stroke-width="3" stroke-linecap="round" />
  <path d="M54 24 C58 18, 50 14, 56 10 C60 14, 56 18, 60 22" fill="none" stroke="#F97316" stroke-width="3" stroke-linecap="round" />
  
  <!-- Java Cup Body -->
  <path d="M30 36 L70 36 L66 64 C65 72, 35 72, 34 64 Z" fill="url(#grad)" filter="url(#glow)" />
  <!-- Cup Handle -->
  <path d="M68 42 C78 42, 80 54, 66 56" fill="none" stroke="#F97316" stroke-width="4" stroke-linecap="round" />
  <!-- Cup Saucer -->
  <path d="M24 76 Q50 82 76 76" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round" />
</svg>